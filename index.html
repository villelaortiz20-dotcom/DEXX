<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>Registro de gym</title>
<style>
:root{
  --bg:#000;--s1:#111;--s2:#1c1c1c;--line:#2e2e2e;
  --txt:#f2f2f2;--mut:#8c8c8c;--acc:#ff6a00;--acc-ink:#000;--warn:#ff7373;
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 var(--body);padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:10px 14px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--s2);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible,[role=checkbox]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.sec{background:transparent}
button:disabled{opacity:.4;cursor:default;transform:none}
/* 16px mínimo en campos para que el celular no haga zoom al escribir */
input,select,textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:48px}
textarea{min-height:76px;resize:vertical}
input[type=range]{padding:0;min-height:44px;accent-color:var(--acc)}
input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{color:var(--mut);font-size:14px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabecera */
.dia{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 6px}
.dia h1{margin:0;font:800 40px/0.95 var(--display);letter-spacing:.01em}
.dia .resumen{font-size:14px;color:var(--mut);text-align:right;white-space:nowrap}
.barra{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 0 2px}
.chips button{min-height:44px;padding:0;border-radius:10px;font-size:14px;background:transparent;font-weight:500}
.chips button.on{background:var(--txt);border-color:var(--txt);color:#000;font-weight:600}

/* Secciones */
.bloque{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bloque h2{margin:0;font:700 22px/1 var(--display);letter-spacing:.02em}
.bloque span{font-size:13px;color:var(--mut)}
.bloque-sec{margin-top:12px}

/* Ejercicio */
.ex{border:1px solid var(--line);border-left:3px solid transparent;border-radius:4px;margin:8px 0;background:var(--s1)}
.ex.activo{border-left-color:var(--acc);background:var(--s2)}
.ex.hecho{opacity:.5}
.ex-h{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;min-height:64px}
.ex-h .t{flex:1;min-width:0}
.ex-h h3{margin:0;font:600 19px/1.15 var(--body)}
.ex-h .sub{margin:3px 0 0;font-size:13px;color:var(--mut)}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:110px;flex:0 0 auto}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mut)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.hecho .dots i.on{background:var(--txt);border-color:var(--txt)}
.ok{width:28px;height:28px;border-radius:50%;background:var(--txt);color:#000;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.ex-p{padding:0 12px 12px;border-top:1px solid var(--line)}
.ex-p .hist{margin:10px 0 0;font-size:14px}
.ex-p .hist b{color:var(--txt);font-weight:500}
.sugerencia{border:1px solid var(--acc);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:15px}
.sugerencia b{color:var(--acc);font-weight:600}
.ej-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ej-sets .chip-s{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ej-sets .chip-s button{min-height:36px;border:0;border-radius:0;background:transparent;padding:0 9px;font-size:14px}
.ej-sets .chip-s button.del{color:var(--warn);padding:0 8px;border-left:1px solid var(--line)}
.ej-sets .chip-s button.cur{background:var(--txt);color:#000}
.edit-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--acc)}
.edit-bar button{min-height:40px;font-size:14px}

/* Registro de serie */
.serie-l{font-size:14px;color:var(--mut);margin-top:12px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;margin:8px 0 4px}
.stepper button{min-height:64px;font:400 30px/1 var(--body);border-radius:12px}
.stepper .c{text-align:center}
.stepper .v{width:100%;background:none;border:0;min-height:auto;padding:0;text-align:center;font:800 52px/1 var(--display);font-variant-numeric:tabular-nums}
.stepper .v:focus{outline:none;color:var(--acc)}
.stepper .l{font-size:13px;color:var(--mut)}
.rir{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.rir button{border:0;border-radius:0;background:transparent;min-height:52px;font:700 22px var(--display)}
.rir button+button{border-left:1px solid var(--line)}
.rir button.on{background:var(--txt);color:#000}
.rir-l{font-size:13px;color:var(--mut)}
.nota-ej{margin-top:10px;min-height:60px}

/* Calentamiento / estiramiento */
.item-wrap{display:flex;gap:6px;margin:8px 0}
.item-wrap .item{flex:1;min-width:0;margin:0}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:4px;background:var(--s1);padding:12px;cursor:pointer;min-height:64px}
.preg{flex:0 0 76px;min-height:64px;padding:0 8px;font-size:13px;border-radius:4px;color:var(--mut);white-space:normal;line-height:1.2}
.item.hecho{opacity:.5}
.item .t{flex:1}
.item h3{margin:0;font:600 17px/1.2 var(--body)}
.item .sub{margin:2px 0 0;font-size:13px;color:var(--mut)}
.check{width:30px;height:30px;border:1.5px solid var(--mut);border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.item.hecho .check{background:var(--txt);border-color:var(--txt);color:#000}

.nota-dia{margin:10px 0 0;padding:8px 10px;border-left:2px solid var(--acc);font-size:14px;color:var(--txt)}
.sub-sec{margin:18px 0 2px}
.sub-sec h3{margin:0;font:700 18px/1 var(--display);letter-spacing:.04em}
.sub-sec .meta{margin:4px 0 0}
.sup{border-left:2px solid var(--acc);padding-left:10px;margin:14px 0 0}
.sup-t{font:700 15px var(--display);letter-spacing:.06em;color:var(--acc);margin-bottom:-2px}
.panel{border:1px solid var(--line);border-radius:4px;padding:14px;margin:18px 0 0;background:var(--s1)}
.acciones{display:grid;gap:8px;margin-top:12px}
.cerrada{border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Calendario */
.mes{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.mes h2{margin:0;font:800 30px/1 var(--display)}
.mes button{min-height:44px;min-width:52px;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.stats div{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--s1)}
.stats b{display:block;font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut)}
.grid-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid-cal .dn{font-size:12px;color:var(--mut);text-align:center;padding:4px 0}
.dcell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;background:var(--s1);color:var(--txt);min-height:44px;padding:0;position:relative;font-size:15px;font-variant-numeric:tabular-nums}
.dcell.fuera{visibility:hidden}
.dcell.hoy{border-color:var(--txt)}
.dcell.hecha{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.dcell.parcial{border-color:var(--acc);color:var(--acc)}
.dcell.falta{color:var(--mut);background:transparent;text-decoration:line-through}
.dcell.plan{color:var(--mut)}
.dcell.sel{box-shadow:inset 0 0 0 2px var(--txt)}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin:10px 0}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#000;border-top:1px solid var(--line)}
nav button{min-height:56px;border:0;background:transparent;font-weight:500;color:var(--mut);padding:0 2px;font-size:14px}
nav button.on{color:#000;background:var(--txt);border-radius:10px;font-weight:600}

#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--txt);color:#000;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;font-weight:500}
#toast.on{opacity:1}

/* Rutina / respaldo */
.card{border:1px solid var(--line);border-radius:4px;padding:14px;margin:8px 0;background:var(--s1)}
.card .row{align-items:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btns{display:flex;gap:6px}
.btns button{min-height:44px;padding:0 12px}
.full{width:100%}
.form{border:1px solid var(--acc);border-radius:4px;padding:14px;margin:8px 0;background:var(--s1)}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--txt);font-size:15px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-act="tab" data-tab="hoy">Hoy</button>
  <button data-act="tab" data-tab="calendario">Calendario</button>
  <button data-act="tab" data-tab="rutina">Rutina</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input id="importar-archivo" type="file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const KEY = 'registro-gym-v2';
const DIAS = [['dom','Domingo'],['lun','Lunes'],['mar','Martes'],['mie','Miércoles'],['jue','Jueves'],['vie','Viernes']];
const NOMBRE_DIA = Object.fromEntries(DIAS);
const DIA_DE_HOY = ['dom','lun','mar','mie','jue','vie','dom'];
const NOTA_GRUPO = {'Técnica':'Descanso de 30 s entre series','Core':'Descanso de 45–60 s entre series'};
const BLOQUES = [['calentamiento','Calentamiento'],['principal','Principal'],['estiramiento','Estiramiento']];
const NOMBRE_BLOQUE = Object.fromEntries(BLOQUES);
const LB_MANC = [3,5,10,15,20,25,30,35,40,45,50];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// tipo: 'reps' | 'tiempo' | 'lista'
// equipo: 'mancuerna' (lb, de la lista) | 'disco' (kg, por paso) | 'libre' (unidad y paso libres)
// series: número fijo. porLado: cada serie se registra una vez por lado (izquierda y derecha).
// pesoObj: peso objetivo; la primera serie del ejercicio se precarga con él (null = sin objetivo).
const ej = o => ({bloque:'principal', tipo:'reps', equipo:'libre', unidad:'kg', paso:1, series:3, objetivo:'10', ss:'', indicacion:'', pesoObj:null, porLado:false, ...o});

// Versión de la rutina. Si los datos guardados son de una versión anterior, se reemplaza la rutina (los registros se conservan).
const RUT_VER = 2;

// Bloques compartidos: se copian a cada día que los usa.
const LISTA = (pref, bloque, items) => items.map((x, i) => ({id: `${pref}-${bloque.slice(0,3)}${i}`, bloque, tipo:'lista', ...x}));
const CAL_RODILLA = [
  {nombre:'Bici estática', objetivo:'3–5 min'},
  {nombre:'Spanish squat (agarrado del rack)', objetivo:'5 × 45 s'},
  {nombre:'Extensión isométrica de rodilla (~60°)', objetivo:'3 × 45 s'},
  {nombre:'Sentadilla lateral', objetivo:'15 reps'},
  {nombre:'Caminata hacia atrás', objetivo:'2 min'},
  {nombre:'Puente de glúteo', objetivo:'2 × 12'},
];
const CAL_UPPER = [
  {nombre:'Bici estática', objetivo:'3–5 min'},
  {nombre:'Círculos de brazo', objetivo:'10 adelante y 10 atrás', indicacion:'Pequeños a grandes'},
  {nombre:'Wall slides', objetivo:'2 × 10', indicacion:'Hasta donde no duela'},
  {nombre:'Gato-camello + rotación torácica', objetivo:'8 + 8 por lado'},
  {nombre:'Rotación externa con cable ligero', objetivo:'2 × 15', indicacion:'Codo fijo'},
  {nombre:'Aproximación press al 50%', objetivo:'10–12 reps', indicacion:'Antes del primer press'},
  {nombre:'Aproximación press al 70%', objetivo:'5–6 reps', indicacion:'Antes del primer press'},
];
const EST_LOWER = [
  {nombre:'Isquiotibiales', objetivo:'2 × 30 s por pierna', indicacion:'Pierna estirada sobre banca o sentado · espalda recta'},
  {nombre:'Glúteo (figura 4 acostado)', objetivo:'2 × 30 s por lado', indicacion:'Jala el muslo hacia el pecho'},
  {nombre:'Flexores de cadera (zancada)', objetivo:'2 × 30 s por lado', indicacion:'Rodilla de atrás extendida, sin apoyarla'},
  {nombre:'Aductores (mariposa sentado)', objetivo:'2 × 30 s', indicacion:'Sin rebotar'},
  {nombre:'Pantorrilla en pared, pierna recta', objetivo:'2 × 30 s por pierna', indicacion:'Talón pegado al piso'},
  {nombre:'Pantorrilla en pared, rodilla flexionada (sóleo)', objetivo:'2 × 30 s por pierna', indicacion:'Talón pegado al piso'},
  {nombre:'Rodillas al pecho acostado', objetivo:'2 × 30 s', indicacion:'Suave'},
  {nombre:'Cuádriceps (opcional)', objetivo:'1 × 20–30 s por pierna', indicacion:'Talón al glúteo con tensión leve. Si molesta el tendón rotuliano, sáltalo'},
];
const EST_UPPER = [
  {nombre:'Pecho en pared', objetivo:'2 × 30 s por lado', indicacion:'Codo a 90° o más bajo'},
  {nombre:'Brazo cruzado al pecho', objetivo:'2 × 30 s por brazo', indicacion:'Deltoide posterior'},
  {nombre:'Trapecio superior', objetivo:'2 × 30 s por lado'},
  {nombre:'Antebrazo: flexores y extensores', objetivo:'30 s cada uno'},
  {nombre:'Rotación torácica en el piso', objetivo:'8 por lado'},
];
const EST_MARTES = [
  {nombre:'Pecho en pared', objetivo:'2 × 30 s por lado'},
  {nombre:'Brazo cruzado al pecho', objetivo:'2 × 30 s por brazo'},
  {nombre:'Trapecio superior', objetivo:'2 × 30 s por lado'},
  {nombre:'Pantorrilla en pared', objetivo:'2 × 30 s por pierna', indicacion:'Talón pegado al piso'},
];
const EST_CORE = [
  {nombre:'Gato-camello', objetivo:'8 reps', indicacion:'Lento'},
  {nombre:'Rotación torácica en el piso (open book)', objetivo:'8 por lado', indicacion:'Sin forzar'},
  {nombre:'Rodillas al pecho acostado', objetivo:'2 × 30 s', indicacion:'Para la zona lumbar'},
  {nombre:'Inclinación lateral sentado', objetivo:'2 × 20–30 s por lado', indicacion:'Una mano en el piso, la otra a lo largo del costado · sin subir el brazo'},
  {nombre:'Esfinge', objetivo:'2 × 20–30 s', indicacion:'Solo si el hombro no molesta'},
];
const REGLA_HOMBRO = 'Regla del hombro: dolor máximo 3/10 y que se resuelva en 24 h. Si algo duele, corta ese ejercicio.';

const SEED = {
  dom:{titulo:'Lower 1', nota:'', ejercicios:[
    ...LISTA('dom','calentamiento',CAL_RODILLA),
    ej({id:'dom-1', nombre:'Jump hold', unidad:'', series:4, objetivo:'5', indicacion:'Peso corporal · RIR 0–1'}),
    ej({id:'dom-2', nombre:'Sentadilla búlgara', equipo:'mancuerna', unidad:'lb', pesoObj:25, series:4, objetivo:'6–8', porLado:true, indicacion:'25 lb por mano · RIR 2'}),
    ej({id:'dom-3', nombre:'RDL a una pierna', equipo:'mancuerna', unidad:'lb', pesoObj:15, series:3, objetivo:'8–10', porLado:true, indicacion:'15–20 lb · RIR 2–3'}),
    ej({id:'dom-4', nombre:'Curl de pierna', unidad:'barras', paso:0.5, pesoObj:3.5, series:3, objetivo:'12', indicacion:'3.5–4 barras · RIR 1–2'}),
    ej({id:'dom-5', nombre:'Step-down excéntrico', unidad:'', series:3, objetivo:'8–10', porLado:true, indicacion:'Sin peso · bajada de 3–4 s · control'}),
    ej({id:'dom-6', nombre:'Máquina de aductores (cerrando)', unidad:'barras', series:3, objetivo:'12–15', indicacion:'Calibra · RIR 1–2'}),
    ej({id:'dom-7', nombre:'Máquina de abductores (abriendo)', unidad:'barras', series:2, objetivo:'15', indicacion:'Calibra · RIR 2'}),
    ej({id:'dom-8', nombre:'Pantorrilla en press', unidad:'barras', series:4, objetivo:'15–20', indicacion:'Calibra · RIR 1'}),
    ...LISTA('dom','estiramiento',EST_LOWER),
  ]},
  lun:{titulo:'Upper 1', nota:REGLA_HOMBRO, ejercicios:[
    ...LISTA('lun','calentamiento',CAL_UPPER),
    ej({id:'lun-1', ss:'A', nombre:'Press declinado con mancuernas', equipo:'mancuerna', unidad:'lb', pesoObj:30, series:3, objetivo:'8–10', indicacion:'30 lb c/u · pausa 1–2 s abajo · bajada de 3 s · RIR 1–2'}),
    ej({id:'lun-2', ss:'A', nombre:'Dead bug', unidad:'', porLado:true, series:3, objetivo:'10', indicacion:'Peso corporal'}),
    ej({id:'lun-3', ss:'B', nombre:'Remo unilateral en máquina (agarre neutro)', unidad:'kg', pesoObj:17.5, series:3, objetivo:'8–10', indicacion:'17–18 kg por lado · RIR 1–2'}),
    ej({id:'lun-4', ss:'B', nombre:'Bird dog', unidad:'', porLado:true, series:3, objetivo:'10', indicacion:'Peso corporal'}),
    ej({id:'lun-5', ss:'C', nombre:'Fly declinado', equipo:'mancuerna', unidad:'lb', pesoObj:17.5, series:2, objetivo:'12–15', indicacion:'17.5 lb c/u · RIR 1–2'}),
    ej({id:'lun-6', ss:'C', nombre:'Suitcase carry', equipo:'mancuerna', unidad:'lb', pesoObj:30, series:3, objetivo:'20–30 m', porLado:true, indicacion:'30 lb o más · por lado'}),
    ej({id:'lun-7', nombre:'Elevación en plano escapular (scaption)', equipo:'mancuerna', unidad:'lb', pesoObj:5, series:2, objetivo:'12–15', indicacion:'5–7.5 lb · pulgares arriba, 30° al frente · solo hasta donde no duela · RIR 3'}),
    ej({id:'lun-8', nombre:'Face pull', unidad:'barras', pesoObj:4, series:3, objetivo:'15', indicacion:'4 barras · RIR 2'}),
    ej({id:'lun-9', nombre:'Press francés con barra', series:3, objetivo:'8–12', indicacion:'Calibra · RIR 1–2'}),
    ej({id:'lun-10', nombre:'Curl predicador', unidad:'barras', pesoObj:3, series:2, objetivo:'12', indicacion:'3 barras · RIR 1'}),
    ej({id:'lun-11', nombre:'Curl de muñeca invertido (palma abajo)', equipo:'mancuerna', unidad:'lb', pesoObj:10, series:2, objetivo:'15–20', indicacion:'10–12.5 lb · RIR 1'}),
    ...LISTA('lun','estiramiento',EST_UPPER),
  ]},
  mar:{titulo:'Rehab', nota:'Después del vóley, ligero. Si la rodilla quedó cargada del vóley, haz solo Wall sit y Spanish squat.', ejercicios:[
    ej({id:'mar-1', grupo:'Rodilla', nombre:'Wall sit', tipo:'tiempo', series:4, objetivo:'30–45', paso:5}),
    ej({id:'mar-2', grupo:'Rodilla', nombre:'Spanish squat', tipo:'tiempo', series:5, objetivo:'45', paso:5}),
    ej({id:'mar-3', grupo:'Rodilla', nombre:'Extensión de cuádriceps en máquina', unidad:'barras', series:3, objetivo:'12–15', indicacion:'Bajada de 3 s'}),

// ---------- carga segura y normalización (compatible con datos de versiones anteriores) ----------
function normalizar(d){
  if(!d || typeof d !== 'object' || !Array.isArray(d.sesiones)) return null;
  if(!d.rutina || (d.rutinaVer || 0) < RUT_VER) d.rutina = structuredClone(SEED);
  d.rutinaVer = RUT_VER;
  for(const [k] of DIAS){
    if(!d.rutina[k]) d.rutina[k] = {titulo: NOMBRE_DIA[k], ejercicios: []};
    d.rutina[k].titulo = String(d.rutina[k].titulo || NOMBRE_DIA[k]);
    d.rutina[k].ejercicios = Array.isArray(d.rutina[k].ejercicios) ? d.rutina[k].ejercicios : [];
    if(!d.rutina[k].ejercicios.length && SEED[k].ejercicios.length) d.rutina[k].ejercicios = structuredClone(SEED[k].ejercicios);
    for(const e of d.rutina[k].ejercicios){
      e.pesoObj = typeof e.pesoObj === 'number' ? e.pesoObj : null;
      e.porLado = !!e.porLado;
      e.series = Math.max(1, parseInt(e.series) || 1);
      e.bloque = e.bloque || 'principal';
    }
  }
  d.sesiones = d.sesiones.filter(s => s && s.fecha && s.dia && Array.isArray(s.series)).map(s => ({
    dolor:{rodilla:0, hombro:0}, nota:'', checks:{}, notas:{}, cerrada:false, ...s,
  }));
  return d;
}
function cargarDatos(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { raw = null; }
  return normalizar(raw) || normalizar({sesiones: []});
}

const redondear = n => Math.round(n*100)/100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fechaDe = d => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
const fechaHoy = () => fechaDe(new Date());
const parseFecha = f => { const [y,m,d] = f.split('-').map(Number); return new Date(y, m-1, d); };
const diaDeFecha = f => DIA_DE_HOY[parseFecha(f).getDay()];
const numObj = ex => parseInt(ex.objetivo) || 10;
const topeReps = ex => Math.max(0, ...(String(ex.objetivo).match(/\d+/g) || [0]).map(Number));
const totalSeries = ex => ex.series * (ex.porLado ? 2 : 1);

const sesionHoy = () => db.sesiones.find(s => s.fecha === fechaHoy() && s.dia === ui.dia) || null;

}
const seriesDe = (s, id) => s ? s.series.filter(x => x.ej === id) : [];
const hechas = (ses, ex) => seriesDe(ses, ex.id).length;
const esHecho = (ses, ex) => ex.tipo === 'lista' ? !!ses?.checks?.[ex.id] : hechas(ses, ex) >= totalSeries(ex);
const ladoDe = (ex, indice) => ex.porLado ? (indice % 2 === 0 ? 'izquierda' : 'derecha') : '';
function ultimaVez(id){
  const hoy = fechaHoy();
  for(const s of [...db.sesiones].reverse()){
    if(s.fecha === hoy && s.dia === ui.dia) continue;
    const r = seriesDe(s, id);
    if(r.length) return r;
  }
  return [];
}

};

// Peso siguiente según equipo
function siguientePeso(ex, val){
  if(ex.equipo === 'mancuerna') return LB_MANC.find(v => v > val) ?? val;
  return redondear(val + ex.paso);
}
function ajustarPeso(ex, val, sg){
  if(ex.equipo === 'mancuerna'){
    if(sg > 0) return LB_MANC.find(v => v > val) ?? val;
    return [...LB_MANC].reverse().find(v => v < val) ?? 0;
  }
  return Math.max(0, redondear(val + sg * ex.paso));
}

// Valores base de la serie:
// - primera serie de la sesión: peso = peso objetivo (o la última vez si no hay objetivo); reps = última vez u objetivo
// - siguientes series: valores de la última serie registrada
function cur(ex){
  if(!ui.cur[ex.id]){
    const lastHoy = seriesDe(sesionHoy(), ex.id).at(-1);
    const ult = ultimaVez(ex.id).at(-1);
    const proxima = lastHoy ? null : sugerenciaProxima(ex);
    const peso = lastHoy ? lastHoy.peso : (proxima != null ? proxima : (ex.pesoObj != null ? ex.pesoObj : (ult ? ult.peso : 0)));
    const reps = lastHoy ? lastHoy.reps : (ult ? ult.reps : numObj(ex));
    const seg = lastHoy ? lastHoy.seg : (ult ? ult.seg : numObj(ex));
    ui.cur[ex.id] = {peso, reps, seg, rir:null};
  }
  return ui.cur[ex.id];
}

// Regla de progresión:
// - En la sesión: si las últimas 2 series alcanzaron el tope de reps con RIR 3 o más, sube el peso para la siguiente.
// - Próxima sesión: si todas las series de la última vez alcanzaron el tope con RIR 3 o más, se sugiere subir.
const cumpleTope = (ex, x) => x.reps >= topeReps(ex) && x.rir != null && x.rir >= 3;
function sugerenciaSesion(ex, ses){
  const s = seriesDe(ses, ex.id);
  if(s.length < 2 || s.length >= totalSeries(ex)) return null;
  const ultimas = s.slice(-2);
  return ultimas.every(x => cumpleTope(ex, x)) ? 'en-sesion' : null;
}
function sugerenciaProxima(ex){
  const ult = ultimaVez(ex.id);
  if(!ult.length || ult.length < totalSeries(ex)) return null;
  return ult.every(x => cumpleTope(ex, x)) ? siguientePeso(ex, ult.at(-1).peso) : null;
}

function idAbierto(ses){
  if(ui.abierto !== undefined) return ui.abierto;
  return principales().find(e => !esHecho(ses, e))?.id ?? null;
}
function siguientePendiente(ses, desdeId){
  const lista = principales();
  const i = lista.findIndex(e => e.id === desdeId);
  const orden = [...lista.slice(i+1), ...lista.slice(0, i+1)];
  return orden.find(e => !esHecho(ses, e))?.id ?? null;
}

function tarjeta(ex, ses, abierto){
  const n = hechas(ses, ex), total = totalSeries(ex), hecho = n >= total, t = ex.tipo === 'tiempo';
  const editando = ui.editSid && ui.editSid.ej === ex.id;
  const c = cur(ex);
  const ult = ultimaVez(ex.id);
  const estado = hecho ? 'hecho' : (abierto ? 'activo' : '');
  const dots = `<span class="dots" aria-label="${n} de ${total} series">${Array.from({length:total},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
  const stepper = (f, label, val) => `<div class="stepper">
      <button data-act="ajustar" data-f="${f}" data-sg="-1" data-id="${ex.id}" aria-label="Bajar ${label}">−</button>
      <div class="c"><input class="v" type="number" inputmode="decimal" value="${val}" data-set="${f}" data-id="${ex.id}" aria-label="${label}">
        <div class="l">${label}</div></div>
      <button data-act="ajustar" data-f="${f}" data-sg="1" data-id="${ex.id}" aria-label="Subir ${label}">+</button></div>`;
  const pesoLabel = ex.equipo === 'mancuerna' ? 'Mancuerna lb c/u' : ex.equipo === 'disco' ? `Discos kg · paso ${ex.paso}` : `Peso ${ex.unidad || ''} · paso ${ex.paso}`;
  const sets = seriesDe(ses, ex.id);
  const setsHTML = sets.length ? `<div class="ej-sets">${sets.map((x,i) => {
      const activa = ui.editSid && ui.editSid.sid === x.sid;
      return `<span class="chip-s"><button class="${activa?'cur':''}" data-act="editarSerie" data-sid="${x.sid}" data-id="${ex.id}" aria-label="Corregir serie ${i+1}">#${i+1} ${esc(fmt(x))} · ${rirTxt(x)}</button><button class="del" data-act="borrar" data-sid="${x.sid}" aria-label="Borrar serie ${i+1}">✕</button></span>`;
    }).join('')}</div>` : '';
  const siguienteLado = ladoDe(ex, n);
  const numSerie = editando ? '' : `Serie ${Math.min(n+1,total)} de ${total}${siguienteLado ? ' · ' + siguienteLado : ''}`;
  const sugerida = sugerenciaSesion(ex, ses) && !editando ? `<div class="sugerencia">Las últimas 2 series llegaron al tope con RIR alto. Subí a <b>${esc(ajustarPesoTxt(ex, c.peso))}</b> para la siguiente.</div>` : '';
  const proxima = sugerenciaProxima(ex);
  const pesoAviso = proxima != null && !hecho && n === 0 ? `<div class="sugerencia">Última vez llegaste al tope con RIR alto. Esta vez prueba <b>${proxima} ${esc(ex.unidad)}</b>.</div>` : '';
  const cuerpo = !hecho || editando ? `
    ${t ? stepper('seg', `Segundos · paso ${ex.paso}`, c.seg)
        : stepper('peso', pesoLabel, c.peso) + stepper('reps', 'Reps', c.reps)}
    <div class="rir-l">RIR · reps que te quedaban (obligatorio)</div>
    <div class="rir" role="radiogroup" aria-label="RIR">${[0,1,2,3,4].map(v => `<button role="radio" aria-checked="${c.rir===v}" class="${c.rir===v?'on':''}" data-act="rir" data-v="${v}" data-id="${ex.id}">${v}</button>`).join('')}</div>
    ${editando
      ? `<div class="edit-bar"><span>Corrigiendo serie</span><button class="sec" data-act="cancelarSerie">Cancelar</button></div>
         <button class="pri full" data-act="guardar" data-id="${ex.id}" ${c.rir==null?'disabled':''} style="margin-top:8px">${c.rir==null ? 'Elige el RIR' : 'Actualizar serie'}</button>`
      : `<button class="pri full" data-act="guardar" data-id="${ex.id}" ${c.rir==null?'disabled':''}>${c.rir==null ? 'Elige el RIR para guardar' : `Guardar ${numSerie.toLowerCase()}`}</button>`}`
    : `<p class="meta" style="margin-top:12px">Completado: ${n} de ${total}. Toca una serie para corregirla.</p>`;
  const panel = abierto || editando ? `<div class="ex-p">
    <p class="hist">Última vez: <b>${ult.length ? esc(ult.map(fmt).join(', ')) : 'sin registro'}</b></p>
    ${ex.indicacion ? `<p class="hist">${esc(ex.indicacion)}</p>` : ''}
    ${!hecho && !editando ? `<p class="serie-l">${numSerie}</p>` : ''}
    ${sugerida}${!sugerida ? pesoAviso : ''}
    ${setsHTML}
    ${cuerpo}
    <textarea class="nota-ej" data-nota-ej="${ex.id}" placeholder="Nota de este ejercicio" aria-label="Nota de ${esc(ex.nombre)}">${esc(ses?.notas?.[ex.id] || '')}</textarea>
    <div class="acciones"><button class="sec full" data-act="preguntar" data-id="${ex.id}">Preguntar a Claude sobre este ejercicio</button></div>
  </div>` : '';
  return `<article class="ex ${estado}" id="ex-${ex.id}">
    <div class="ex-h" data-act="abrir" data-id="${ex.id}" role="button" tabindex="0" aria-expanded="${abierto}">

      <div class="t"><h3>${esc(ex.nombre)}</h3>
        <div class="sub">${ex.series} × ${esc(ex.objetivo)}${t?' s':' reps'}${ex.porLado ? ' por lado' : ''}${n && !hecho ? ` · faltan ${total-n}` : ''}</div></div>
      ${dots}
    </div>
    ${panel}
  </article>`;
}
function ajustarPesoTxt(ex, val){ const nv = siguientePeso(ex, val); return `${nv} ${ex.unidad}`.trim(); }

function vistaHoy(){
  const d = db.rutina[ui.dia], ses = sesionHoy();
  const dolor = ses ? ses.dolor : {rodilla:0, hombro:0};
  const abierto = idAbierto(ses);
  const prin = principales();
  const totalS = prin.reduce((a,e) => a + totalSeries(e), 0);
  const hechasS = prin.reduce((a,e) => a + Math.min(hechas(ses,e), totalSeries(e)), 0);
  const pct = totalS ? Math.round(hechasS/totalS*100) : 0;
  const completos = prin.filter(e => esHecho(ses,e)).length;
  const cerrada = !!ses?.cerrada;

  let html = chipsDias() + `<div class="dia"><h1>${esc(d.titulo)}</h1>
    <div class="resumen tnum">${completos}/${prin.length} ejercicios</div></div>
    <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Avance del día"><i style="width:${pct}%"></i></div>
    <div class="meta tnum">${NOMBRE_DIA[ui.dia]} · ${hechasS} de ${totalS} series</div>${d.nota ? `<p class="nota-dia">${esc(d.nota)}</p>` : ''}`;
  if(!d.ejercicios.length) html += `<p class="meta" style="margin-top:24px">Este día no tiene ejercicios. Agrégalos en Rutina.</p>`;

  for(const [clave, etiqueta] of BLOQUES){
    const items = d.ejercicios.filter(e => (e.bloque || 'principal') === clave);
    if(!items.length) continue;
    const listos = items.filter(e => esHecho(ses,e)).length;
    html += `<section class="bloque-sec"><div class="bloque"><h2>${etiqueta}</h2><span class="tnum">${listos}/${items.length}</span></div>`;
    const grupos = [];
    for(const ex of items){
      const prev = grupos.at(-1);
      if(clave==='principal' && ex.ss && prev && prev.ss === ex.ss) prev.items.push(ex);
      else grupos.push({ss:ex.ss, items:[ex]});
    }
    let grupoActual = null;
    html += grupos.map(g => {
      let cab = '';
      const gr = g.items[0].grupo || null;
      if(clave === 'principal' && gr && gr !== grupoActual){
        grupoActual = gr;
        cab = `<div class="sub-sec"><h3>${esc(gr)}</h3>${NOTA_GRUPO[gr] ? `<p class="meta">${esc(NOTA_GRUPO[gr])}</p>` : ''}</div>`;
      }
      const inner = g.items.map(e => e.tipo === 'lista' ? tarjetaLista(e, ses) : tarjeta(e, ses, e.id === abierto)).join('');
      return cab + (g.ss && clave==='principal' ? `<div class="sup"><div class="sup-t">Superserie ${esc(g.ss)}</div>${inner}</div>` : inner);
    }).join('');
    html += `</section>`;
  }

  html += `<div class="panel">
    ${[['rodilla','Dolor de rodilla'],['hombro','Dolor de hombro']].map(([k,l]) =>
      `<label for="d-${k}">${l}: <b class="tnum" data-out="${k}">${dolor[k]}</b> / 10</label>
       <input id="d-${k}" type="range" min="0" max="10" step="1" value="${dolor[k]}" data-dolor="${k}">`).join('')}
    <label for="nota-sesion">Nota de la sesión</label>
    <textarea id="nota-sesion" data-nota placeholder="¿Cómo se sintió hoy?" style="font-size:16px">${esc(ses ? ses.nota : '')}</textarea>
    <div class="acciones">
      ${cerrada
        ? `<div class="cerrada"><span>Sesión terminada</span><button class="sec" data-act="reabrir">Reabrir</button></div>`
        : (ses && ses.series.length ? `<button data-act="terminar">Terminar sesión</button>` : '')}
      <button class="pri full" data-act="copiar">Copiar resumen de hoy</button>
    </div>
  </div>`;
  return html;
}

function infoEj(e){
  if(e.tipo === 'lista') return `${NOMBRE_BLOQUE[e.bloque]} · ${esc(e.objetivo)}`;
  const obj = `${e.series} × ${esc(e.objetivo)}${e.tipo==='tiempo' ? ' s' : ' reps'}${e.porLado ? ' por lado' : ''}`;

    : (e.unidad ? ` · peso (${e.unidad}), paso ${e.paso}` : ' · sin peso');

}

// ---------- vistas: Calendario ----------
function estadoDia(fecha){
  const hoy = fechaHoy();
  const dia = diaDeFecha(fecha);
  const plan = db.rutina[dia].ejercicios.some(e => e.tipo !== 'lista');
  const sesiones = db.sesiones.filter(s => s.fecha === fecha);
  const sets = sesiones.reduce((a,s) => a + s.series.length, 0);
  const cerrada = sesiones.some(s => s.cerrada);
  const planTotal = db.rutina[dia].ejercicios.filter(e => e.tipo !== 'lista' && (e.bloque||'principal')==='principal').reduce((a,e) => a + totalSeries(e), 0);
  if(cerrada || (sets && planTotal && sets >= planTotal)) return 'hecha';
  if(sets) return 'parcial';
  if(plan && fecha < hoy) return 'falta';
  if(plan) return 'plan';
  return '';
}
function vistaCalendario(){
  const {y, m} = ui.mes;
  const primero = new Date(y, m, 1), ultimo = new Date(y, m+1, 0).getDate();
  const offset = (primero.getDay() + 6) % 7;
  const hoy = fechaHoy();
  // Estadísticas del mes hasta hoy
  let programadas = 0, completas = 0, parciales = 0;
  for(let d = 1; d <= ultimo; d++){
    const f = fechaDe(new Date(y, m, d));
    if(f > hoy) break;
    const dia = diaDeFecha(f);
    if(db.rutina[dia].ejercicios.some(e => e.tipo !== 'lista')) programadas++;
    const e = estadoDia(f);
    if(e === 'hecha') completas++; else if(e === 'parcial') parciales++;
  }
  const porcentaje = programadas ? Math.round(completas/programadas*100) : 0;

  let cells = '';
  for(let i = 0; i < offset; i++) cells += `<span class="dcell fuera" aria-hidden="true"></span>`;
  for(let d = 1; d <= ultimo; d++){
    const f = fechaDe(new Date(y, m, d));
    const est = estadoDia(f);
    const clases = ['dcell', est, f === hoy ? 'hoy' : '', ui.diaCal === f ? 'sel' : ''].join(' ').replace(/\s+/g,' ').trim();
    cells += `<button class="${clases}" data-act="diaCal" data-f="${f}" aria-label="${d} de ${MESES[m]}${est ? ', ' + est : ''}">${d}</button>`;
  }

  let html = `<div class="dia"><h1>Calendario</h1></div>
    <div class="mes">
      <button class="sec" data-act="mes" data-d="-1" aria-label="Mes anterior">‹</button>
      <h2>${MESES[m]} ${y}</h2>
      <button class="sec" data-act="mes" data-d="1" aria-label="Mes siguiente">›</button>
    </div>
    <div class="stats">
      <div><b>${completas}</b><span>completas de ${programadas}</span></div>
      <div><b>${porcentaje}%</b><span>consistencia</span></div>
      <div><b>${parciales}</b><span>parciales</span></div>
    </div>
    <div class="grid-cal">
      ${['L','M','M','J','V','S','D'].map(l => `<span class="dn" aria-hidden="true">${l}</span>`).join('')}
      ${cells}
    </div>
    <div class="leyenda">
      <span><i style="background:var(--acc);border-color:var(--acc)"></i>Completa</span>
      <span><i style="border-color:var(--acc)"></i>Parcial</span>
      <span><i></i>Programada</span>
      <span><i style="text-decoration:line-through">x</i>Faltó</span>
    </div>`;

  if(ui.diaCal){
    const sesiones = db.sesiones.filter(s => s.fecha === ui.diaCal && hayContenido(s));
    html += `<div class="panel"><h2 style="margin:0 0 8px;font:700 22px var(--display)">${ui.diaCal}</h2>`;
    if(!sesiones.length) html += `<p class="meta">Sin registros este día.</p>`;
    html += sesiones.map(s => {
      const d = db.rutina[s.dia] || {ejercicios:[]};
      const ids = [...new Set(s.series.map(x => x.ej))];
      const lineas = ids.map(id => {
        const ss = seriesDe(s, id), e = d.ejercicios.find(x => x.id === id);
        return `<div class="meta">• ${esc(ss[0].nombre)}: ${esc(ss.map(x => `${fmt(x)} ${rirTxt(x)}`).join(', '))}${e && ss.length < totalSeries(e) ? ` (${ss.length}/${totalSeries(e)})` : ''}</div>`;
      }).join('');
      return `<div class="card"><div class="row"><b style="font-weight:600">${NOMBRE_DIA[s.dia] || s.dia}${s.cerrada ? ' · terminada' : ''}</b>
        <button data-act="copiar" data-id="${s.id}">Copiar</button></div>${lineas}
        <div class="meta tnum" style="margin-top:6px">Dolor rodilla ${s.dolor.rodilla} · hombro ${s.dolor.hombro}</div></div>`;
    }).join('');
    html += `</div>`;
  }

  const q = ui.busqueda.trim().toLowerCase();
  html += `<div class="panel"><label for="buscar">Buscar un ejercicio en tu historial</label>
    <input id="buscar" data-busqueda value="${esc(ui.busqueda)}" placeholder="Ej. sentadilla">`;
  if(q){
    const hits = [...db.sesiones].reverse().filter(s => s.series.some(x => x.nombre.toLowerCase().includes(q))).slice(0, 15);
    html += hits.length ? hits.map(s => {
      const xs = s.series.filter(x => x.nombre.toLowerCase().includes(q));
      return `<div class="card"><div class="row"><b style="font-weight:600">${s.fecha} · ${NOMBRE_DIA[s.dia] || s.dia}</b></div>
        <div class="meta">${esc(xs[0].nombre)}: ${esc(xs.map(x => `${fmt(x)} ${rirTxt(x)}`).join(', '))}</div></div>`;
    }).join('') : `<p class="meta">Sin resultados.</p>`;
  }
  html += `<div class="acciones" style="margin-top:14px">
      <button class="full" data-act="exportar">Exportar respaldo (.json)</button>
      <button class="full" data-act="importar">Importar respaldo (reemplaza los datos)</button>
    </div></div>`;
  return html;
}

// ---------- resumen para pegar en otro chat ----------
function resumen(s){
  const d = db.rutina[s.dia] || {titulo:'', ejercicios:[]};
  const L = [`Entreno ${s.fecha} · ${NOMBRE_DIA[s.dia] || s.dia} (${d.titulo})${s.cerrada ? ' · terminada' : ''}`];
  const ids = [...new Set(s.series.map(x => x.ej))];
  for(const id of ids){
    const ss = seriesDe(s, id), e = d.ejercicios.find(x => x.id === id);
    const total = e ? totalSeries(e) : ss.length;
    const obj = e ? ` (obj ${e.series} series${e.porLado ? ' por lado' : ''} × ${e.objetivo}${e.tipo==='tiempo'?' s':''}${e.ss?', SS '+e.ss:''})` : '';
    const estado = e && ss.length < total ? ` · incompleto ${ss.length}/${total}` : '';
    L.push(`- ${ss[0].nombre}${obj}${estado}: ${ss.map(x => `${fmt(x)} ${rirTxt(x)}`).join(', ')}`);
    const nota = s.notas?.[id];
    if(nota) L.push(`  Nota del ejercicio: ${nota}`);
  }
  for(const e of d.ejercicios.filter(e => e.tipo !== 'lista' && (e.bloque||'principal')==='principal' && !ids.includes(e.id))){
    L.push(`- ${e.nombre} (obj ${e.series} series × ${e.objetivo}): sin registro`);
  }
  const listas = d.ejercicios.filter(e => e.tipo === 'lista');
  for(const [clave, etiqueta] of BLOQUES){
    if(clave === 'principal') continue;
    const del = listas.filter(e => e.bloque === clave);
    if(!del.length) continue;
    L.push(`${etiqueta}: ${del.filter(e => s.checks?.[e.id]).length}/${del.length} completados`);
  }
  L.push(`Dolor: rodilla ${s.dolor.rodilla}/10, hombro ${s.dolor.hombro}/10`);
  if(s.nota) L.push(`Nota: ${s.nota}`);
  L.push('¿Cómo subo la carga la próxima vez para sobrecarga progresiva?');
  return L.join('\n');
}

async function copiarTexto(txt){
  try { await navigator.clipboard.writeText(txt); }
  catch {
    const t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly','');
    t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
  }
  toast('Copiado');
}
let toastT;
function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }

// Contexto para preguntar a Claude: no usa una clave de API dentro del celular; copia el contexto y abre claude.ai.
function prepararPregunta(ex){
  const ses = sesionHoy(), ult = ultimaVez(ex.id);
  const sets = seriesDe(ses, ex.id);
  if(ex.tipo === 'lista'){
    const bloque = NOMBRE_BLOQUE[ex.bloque] || ex.bloque;
    return [
      `Ejercicio de ${bloque.toLowerCase()}: ${ex.nombre}`,
      `Indicación de la rutina: ${ex.objetivo}${ex.indicacion ? ' · ' + ex.indicacion : ''}`,
      `Dolor hoy: rodilla ${ses?.dolor.rodilla ?? 0}/10, hombro ${ses?.dolor.hombro ?? 0}/10`,
      '',
      'Mi pregunta: '
    ].join('\n');
  }
  const L = [
    `Ejercicio: ${ex.nombre}`,
    `Plan: ${ex.series} series${ex.porLado ? ' por lado' : ''} × ${ex.objetivo}${ex.tipo==='tiempo'?' s':' reps'}`,
    ex.indicacion ? `Indicaciones: ${ex.indicacion}` : '',
    ult.length ? `Última vez: ${ult.map(fmt).join(', ')}` : '',
    sets.length ? `Hoy: ${sets.map(x => `${fmt(x)} ${rirTxt(x)}`).join(', ')}` : 'Hoy: sin series todavía',
    `Dolor hoy: rodilla ${ses?.dolor.rodilla ?? 0}/10, hombro ${ses?.dolor.hombro ?? 0}/10`,
    '',
    'Mi pregunta: '
  ].filter(Boolean);
  return L.join('\n');
}

$('#importar-archivo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try {
    const nuevo = normalizar(JSON.parse(await f.text()));
    if(!nuevo) throw new Error('formato');

});

// ---------- eventos ----------
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'tab':
      ui.tab = b.dataset.tab; ui.abierto = undefined; ui.editando = null; ui.editSid = null;
      break;
    case 'dia': ui.dia = b.dataset.dia; ui.abierto = undefined; ui.editando = null; ui.editSid = null; break;
    case 'abrir': {
      const actual = idAbierto(sesionHoy());
      ui.abierto = actual === id ? null : id;
      if(ui.editSid && ui.editSid.ej !== id) ui.editSid = null;
      break;
    }
    case 'check': {
      const s = sesionHoyOCrear(); s.checks = s.checks || {};
      s.checks[id] = !s.checks[id]; guardar();
      break;
    }
    case 'ajustar': {
      const ex = buscarEj(id), c = cur(ex), f = b.dataset.f, sg = Number(b.dataset.sg);
      if(f === 'peso') c.peso = ajustarPeso(ex, c.peso, sg);
      else if(f === 'seg') c.seg = Math.max(0, redondear(c.seg + sg * ex.paso));
      else c.reps = Math.max(0, c.reps + sg);
      break;
    }
    case 'rir': cur(buscarEj(id)).rir = Number(b.dataset.v); break;
    case 'guardar': {
      const ex = buscarEj(id), c = cur(ex);
      if(c.rir == null){ toast('Elige el RIR antes de guardar'); break; }
      // Corrección de una serie existente
      if(ui.editSid && ui.editSid.ej === ex.id){
        const s = sesionHoy(), serie = s?.series.find(x => x.sid === ui.editSid.sid);
        if(serie){ Object.assign(serie, {peso:c.peso, reps:c.reps, seg:c.seg, rir:c.rir}); guardar(); toast('Serie corregida'); }
        ui.editSid = null;
        break;
      }
      const s = sesionHoyOCrear();
      if(esHecho(s, ex)) break;
      const indice = hechas(s, ex);
      s.series.push({sid:uid(), ej:ex.id, nombre:ex.nombre, tipo:ex.tipo, unidad:ex.unidad, lado: ladoDe(ex, indice),
                     peso:c.peso, reps:c.reps, seg:c.seg, rir:c.rir});
      if(!guardar()) break;
      // Tras guardar: la siguiente serie usa estos valores, y el RIR se vuelve a elegir
      c.rir = null;
      if(sugerenciaSesion(ex, s)){
        c.peso = siguientePeso(ex, c.peso);
        ui.hint[ex.id] = true;
      }
      if(esHecho(s, ex)){
        const sig = siguientePendiente(s, ex.id);
        ui.abierto = sig; ui.scrollTo = sig;
        toast(sig ? `${ex.nombre}: completo. Sigue ${buscarEj(sig).nombre}` : `${ex.nombre}: completo. Día terminado`);
      } else {
        toast(`Guardado: ${fmt(s.series.at(-1))}`);
      }
      break;
    }
    case 'editarSerie': {
      const s = sesionHoy(), serie = s?.series.find(x => x.sid === b.dataset.sid);
      if(!serie) break;
      ui.editSid = {ej: serie.ej, sid: serie.sid};
      ui.abierto = serie.ej;
      ui.cur[serie.ej] = {peso:serie.peso, reps:serie.reps, seg:serie.seg, rir:serie.rir};
      break;
    }
    case 'cancelarSerie': ui.editSid = null; break;
    case 'borrar': {
      const s = sesionHoy();
      if(s && confirm('¿Borrar esta serie?')){ s.series = s.series.filter(x => x.sid !== b.dataset.sid); if(ui.editSid?.sid === b.dataset.sid) ui.editSid = null; guardar(); }
      break;
    }
    case 'terminar': {
      const s = sesionHoy();
      if(s && confirm('¿Terminar la sesión de hoy? Puedes reabrirla después.')){ s.cerrada = true; guardar(); toast('Sesión terminada'); }
      break;
    }
    case 'reabrir': { const s = sesionHoy(); if(s){ s.cerrada = false; guardar(); } break; }
    case 'preguntar': {
      const ex = buscarEj(id);
      const txt = prepararPregunta(ex);
      copiarTexto(txt);
      window.open('https://claude.ai/new', '_blank', 'noopener');
      break;
    }
    case 'editar': ui.editando = id; ui.tab = 'rutina'; break;
    case 'cancelar': ui.editando = null; break;
    case 'borrarEj':
      if(confirm('¿Eliminar este ejercicio de la rutina? Sus series del historial se conservan.')){
        db.rutina[ui.dia].ejercicios = db.rutina[ui.dia].ejercicios.filter(x => x.id !== id);
        ui.editando = null; guardar();
      }
      break;
    case 'mover': {
      const lista = db.rutina[ui.dia].ejercicios, i = lista.findIndex(x => x.id === id), j = i + Number(b.dataset.dir);
      if(j >= 0 && j < lista.length){ [lista[i], lista[j]] = [lista[j], lista[i]]; guardar(); }
      break;
    }
    case 'copiar': {
      const s = id ? db.sesiones.find(x => x.id === id) : sesionHoy();
      if(!s || !hayContenido(s)){ toast('Aún no hay nada que copiar'); break; }
      copiarTexto(resumen(s));
      break;
    }
    case 'mes': {
      const d = Number(b.dataset.d); let m = ui.mes.m + d, y = ui.mes.y;
      if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
      ui.mes = {y, m}; ui.diaCal = null; break;
    }
    case 'diaCal': ui.diaCal = ui.diaCal === b.dataset.f ? null : b.dataset.f; break;
    case 'exportar': exportar(); break;
    case 'importar': $('#importar-archivo').click(); return;
  }
  render();
});

// Enter/Espacio también activan ejercicios y casillas
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ex-h, .item')){
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, id = f.dataset.form, fd = new FormData(f);
  const nombre = String(fd.get('nombre') || '').trim(); if(!nombre) return;
  const equipo = fd.get('equipo'), tipo = fd.get('tipo');
  const unidad = equipo === 'mancuerna' ? 'lb' : equipo === 'disco' ? 'kg' : String(fd.get('unidad') || '').trim();
  const pobj = String(fd.get('pesoObj') || '').trim();
  const obj = {nombre, bloque: fd.get('bloque'), tipo, equipo, unidad,
    paso: Number(fd.get('paso')) || 1,
    pesoObj: pobj === '' ? null : Math.max(0, Number(pobj) || 0),
    porLado: fd.get('porLado') === 'on' && tipo !== 'lista',
    series: tipo === 'lista' ? 1 : Math.max(1, parseInt(fd.get('series')) || 1),
    objetivo: String(fd.get('objetivo') || '').trim() || '10',
    ss: tipo === 'lista' ? '' : String(fd.get('ss') || '').trim(),
    indicacion: String(fd.get('indicacion') || '').trim()};
  const lista = db.rutina[ui.dia].ejercicios;
  if(id === 'nuevo') lista.push({id:uid(), ...obj}); else Object.assign(lista.find(x => x.id === id), obj);
  ui.editando = null; guardar(); render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('[data-dolor]')){
    const k = t.dataset.dolor;
    sesionHoyOCrear().dolor[k] = Number(t.value);
    document.querySelector(`[data-out="${k}"]`).textContent = t.value;
    guardar();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-set]')){
    const c = cur(buscarEj(t.dataset.id)), f = t.dataset.set;
    c[f] = Math.max(0, redondear(Number(t.value) || 0));
    render();
  }
  if(t.matches('[data-nota]')){ sesionHoyOCrear().nota = t.value; guardar(); }
  if(t.matches('[data-nota-ej]')){
    const s = sesionHoyOCrear();
    s.notas = s.notas || {};
    s.notas[t.dataset.notaEj] = t.value.trim();
    guardar();
  }
  if(t.matches('[data-titulo]')){ db.rutina[ui.dia].titulo = t.value.trim() || db.rutina[ui.dia].titulo; guardar(); render(); }
  if(t.matches('[data-busqueda]')){ ui.busqueda = t.value; render(); }
});

function render(){
  const y = window.scrollY;
  const vistas = {hoy: vistaHoy, calendario: vistaCalendario, rutina: vistaRutina};
  app.innerHTML = vistas[ui.tab]();
  document.querySelectorAll('nav button').forEach(b => {
    const on = b.dataset.tab === ui.tab;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if(ui.scrollTo){
    const el = document.getElementById('ex-' + ui.scrollTo);
    ui.scrollTo = null;
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo(0, y);
}
render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
